<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premiere Pro キーボードショートカットビューア</title>
    <!-- ファビコン -->
    <link rel="icon" type="image/png" sizes="32x32" href="./public/icon/rose-icon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./public/icon/rose-icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/icon/rose-icon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/simple-keyboard@latest/build/css/index.css">
    <style>
        /* simple-keyboard カスタムスタイル */
        .simple-keyboard {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .simple-keyboard .hg-button {
            height: 50px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .simple-keyboard .hg-button:hover {
            background-color: #f3f4f6;
            transform: translateY(-1px);
        }
        .simple-keyboard .hg-button.hg-activeButton {
            background-color: #3b82f6;
            color: white;
        }
        .shortcut-list {
            max-height: 400px;
            overflow-y: auto;
        }
        /* レスポンシブ調整: 小さな画面ではキーのサイズを小さくする */
        @media (max-width: 768px) {
            .simple-keyboard .hg-button {
                height: 40px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 border-b-4 border-blue-500 pb-2">
            Premiere Pro キーボードショートカットビューア (Mac)
        </h1>

        <!-- 説明エリア -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <p class="text-gray-700 mb-4">
                キーボード上のキーをクリック/タップすると、そのキーが含まれる全てのPremiere Proショートカットが右側に表示されます。
            </p>
            <p class="text-sm text-gray-500 mb-4">
                キーボードは <a href="https://hodgef.com/simple-keyboard/getting-started/" target="_blank" class="text-blue-600 hover:text-blue-800 underline">simple-keyboard</a> ライブラリを使用しています。
            </p>
            <div id="selected-key-display" class="text-xl font-mono text-center p-3 bg-blue-100 text-blue-800 rounded-lg shadow-inner border border-blue-300">
                キーを選択してください
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 仮想キーボードエリア (左側) -->
            <div class="lg:w-2/3 bg-gray-200 p-4 rounded-xl shadow-xl border-t-8 border-gray-300">
                <div class="simple-keyboard"></div>
            </div>

            <!-- ショートカット表示エリア (右側) -->
            <div class="lg:w-1/3">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 pt-2">
                    関連ショートカット
                </h2>
                <div id="shortcuts-output" class="shortcut-list bg-white p-4 rounded-xl shadow-inner border border-gray-300">
                    <p class="text-gray-500">キーボードのキーを選択してください。</p>
                </div>
            </div>
        </div>

        <!-- すべてのショートカット一覧表 -->
        <div class="mt-12 bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 border-b-2 border-blue-500 pb-3">
                すべてのショートカット一覧
            </h2>
            <div id="all-shortcuts-table" class="overflow-x-auto">
                <!-- テーブルはJavaScriptで生成されます -->
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/simple-keyboard@latest/build/index.js"></script>
    <script>
        // 1. データ定義: ユーザー提供データから抽出した主要ショートカット
        const shortcutData = [
            // ツール
            { keys: ["V"], command: "選択ツール", category: "ツール" },
            { keys: ["⇧", "A"], command: "トラックの後方選択ツール", category: "ツール" },
            { keys: ["B"], command: "リップルツール", category: "ツール" },
            { keys: ["U"], command: "スライドツール", category: "ツール" },
            { keys: ["P"], command: "ペンツール", category: "ツール" },
            { keys: ["T"], command: "横書き文字ツール", category: "ツール" },
            // ファイル/編集
            { keys: ["⌘", ","], command: "設定… 一般...", category: "ファイル・編集" },
            { keys: ["⌘", "Q"], command: "Premiere Pro を終了", category: "ファイル・編集" },
            { keys: ["⌥", "⌘", "N"], command: "新規 プロジェクト...", category: "ファイル・編集" },
            { keys: ["⌘", "N"], command: "新規 シーケンス...", category: "ファイル・編集" },
            { keys: ["⌘", "O"], command: "プロジェクトを開く...", category: "ファイル・編集" },
            { keys: ["⌘", "S"], command: "保存", category: "ファイル・編集" },
            { keys: ["⌘", "I"], command: "読み込み...", category: "ファイル・編集" },
            { keys: ["⌘", "M"], command: "書き出し メディア...", category: "ファイル・編集" },
            { keys: ["⌘", "Z"], command: "取り消し", category: "ファイル・編集" },
            { keys: ["⇧", "⌘", "Z"], command: "やり直し", category: "ファイル・編集" },
            { keys: ["⌘", "X"], command: "カット", category: "ファイル・編集" },
            { keys: ["⌘", "C"], command: "コピー", category: "ファイル・編集" },
            { keys: ["⌘", "V"], command: "ペースト", category: "ファイル・編集" },
            { keys: ["⌘", "A"], command: "すべてを選択", category: "ファイル・編集" },
            { keys: ["D"], command: "消去", category: "ファイル・編集" },
            { keys: ["⇧", "D"], command: "リップル削除", category: "ファイル・編集" },
            { keys: ["⌘", "E"], command: "オリジナルを編集", category: "ファイル・編集" },
            // クリップ/シーケンス
            { keys: ["G"], command: "オーディオゲイン...", category: "クリップ・シーケンス" },
            { keys: ["⌘", "R"], command: "速度・デュレーション...", category: "クリップ・シーケンス" },
            { keys: ["I"], command: "インサート / インをマーク", category: "クリップ・シーケンス" },
            { keys: ["."], command: "上書き", category: "クリップ・シーケンス" },
            { keys: ["⌘", "L"], command: "リンク", category: "クリップ・シーケンス" },
            { keys: ["⌘", "G"], command: "グループ化", category: "クリップ・シーケンス" },
            { keys: ["C"], command: "編集点を追加", category: "クリップ・シーケンス" },
            { keys: ["O"], command: "アウトをマーク", category: "クリップ・シーケンス" },
            { keys: [";"], command: "リフト", category: "クリップ・シーケンス" },
            { keys: [":"], command: "抽出", category: "クリップ・シーケンス" },
            { keys: ["Z"], command: "ズームイン", category: "クリップ・シーケンス" },
            { keys: ["X"], command: "ズームアウト", category: "クリップ・シーケンス" },
            { keys: ["Q"], command: "前の編集点をリップルトリミング", category: "クリップ・シーケンス" },
            { keys: ["W"], command: "次の編集点をリップルトリミング", category: "クリップ・シーケンス" },
            { keys: ["]"], command: "クリップボリュームを上げる", category: "クリップ・シーケンス" },
            { keys: ["["], command: "クリップボリュームを下げる", category: "クリップ・シーケンス" },
            { keys: ["⇧", "@"], command: "アクティブフレームを最大化/戻す", category: "表示" },
            { keys: ["@"], command: "カーソルがあるフレームを最大化/戻す", category: "表示" },
            { keys: ["⇧", "⌘", "F"], command: "フルスクリーン表示の切り替え", category: "表示" },
            { keys: ["削除"], command: "選択項目を削除", category: "ファイル・編集" },
            // タイムライン移動
            { keys: ["右"], command: "1 フレーム先へ進む", category: "タイムライン移動" },
            { keys: ["左"], command: "1 フレーム前へ戻る", category: "タイムライン移動" },
            { keys: ["⇧", "右"], command: "複数フレーム先へ進む", category: "タイムライン移動" },
            { keys: ["⇧", "左"], command: "複数フレーム前へ戻る", category: "タイムライン移動" },
            { keys: ["上"], command: "前の編集点へ移動", category: "タイムライン移動" },
            { keys: ["下"], command: "次の編集点へ移動", category: "タイムライン移動" },
            { keys: ["スペースキー"], command: "再生 / 停止", category: "再生" },
            { keys: ["End"], command: "シーケンス/クリップ終了位置へ移動", category: "タイムライン移動" },
            { keys: ["Home"], command: "シーケンス/クリップ開始位置へ移動", category: "タイムライン移動" },
        ];

        // 2. キーの表示名とショートカットキー配列内のIDをマッピング
        const keyMap = {
            '{bksp}': '削除',
            '{enter}': 'リターン',
            '{space}': 'スペースキー',
            '{shift}': '⇧',
            '{shiftleft}': '⇧',
            '{shiftright}': '⇧',
            '{alt}': '⌥',
            '{altleft}': '⌥',
            '{altright}': '⌥',
            '{ctrl}': '⌃',
            '{meta}': '⌘',
            '{metaleft}': '⌘',
            '{metaright}': '⌘',
            '{tab}': 'Tab',
            '{lock}': 'Caps Lock',
            '{arrowup}': '上',
            '{arrowdown}': '下',
            '{arrowleft}': '左',
            '{arrowright}': '右',
        };

        const shortcutsOutput = document.getElementById('shortcuts-output');
        const selectedKeyDisplay = document.getElementById('selected-key-display');
        
        /**
         * ショートカットキーの配列を表示用の文字列に変換する
         * @param {string[]} keys 
         * @returns {string}
         */
        const formatKeys = (keys) => {
            return keys.map(key => {
                let display = key;
                let colorClass = 'text-gray-900';
                
                // 修飾キーのシンボルと色を定義
                if (key === '⌘') { display = '<span class="modifier-symbol text-blue-600">⌘</span>'; colorClass = 'font-bold'; }
                else if (key === '⇧') { display = '<span class="modifier-symbol text-red-600">⇧</span>'; colorClass = 'font-bold'; }
                else if (key === '⌥') { display = '<span class="modifier-symbol text-green-600">⌥</span>'; colorClass = 'font-bold'; }
                else if (key === '⌃') { display = '<span class="modifier-symbol text-purple-600">⌃</span>'; colorClass = 'font-bold'; }
                else if (key.length > 1 && key !== 'Home' && key !== 'End' ) { display = `<span class="text-xs text-gray-500">${key}</span>`; }
                
                return `<span class="${colorClass} px-0.5">${display}</span>`;
            }).join(' <span class="text-gray-400 font-bold">+</span> ');
        };

        /**
         * キーのクリックイベントハンドラ
         * @param {string} button クリックされたキーのID
         */
        const handleKeyClick = (button) => {
            // simple-keyboard のボタン名を内部IDに変換
            let keyId = keyMap[button] || button.toUpperCase();

            // 選択されたキーの表示を更新
            let displayKey = keyId;
            if (keyId === '⌥') displayKey = 'Option (⌥)';
            else if (keyId === '⌘') displayKey = 'Command (⌘)';
            else if (keyId === '⇧') displayKey = 'Shift (⇧)';
            else if (keyId === '⌃') displayKey = 'Control (⌃)';
            selectedKeyDisplay.innerHTML = `選択中のキー: <span class="text-blue-700 font-extrabold">${displayKey}</span>`;

            // 関連ショートカットをフィルタリング
            const relevantShortcuts = shortcutData.filter(s => s.keys.includes(keyId));

            // 結果のレンダリング
            if (relevantShortcuts.length === 0) {
                shortcutsOutput.innerHTML = `<p class="text-gray-500 p-2">このキーに関連するショートカットは見つかりませんでした。</p>`;
                return;
            }

            shortcutsOutput.innerHTML = `<ul class="space-y-3"></ul>`;
            const ul = shortcutsOutput.querySelector('ul');
            
            // コマンド名でソート
            relevantShortcuts.sort((a, b) => a.command.localeCompare(b.command, 'ja'));
            
            relevantShortcuts.forEach(s => {
                const li = document.createElement('li');
                li.className = 'flex flex-col sm:flex-row justify-between items-start sm:items-center text-gray-700 border-b pb-2';
                li.innerHTML = `
                    <span class="text-sm font-medium mb-1 sm:mb-0">${s.command}</span>
                    <span class="text-xs font-mono bg-gray-100 px-2 py-1 rounded-md shadow-xs ml-0 sm:ml-2">${formatKeys(s.keys)}</span>
                `;
                ul.appendChild(li);
            });
        };

        /**
         * simple-keyboard インスタンスを初期化する
         */
        const initKeyboard = () => {
            const Keyboard = window.SimpleKeyboard.default;
            
            const keyboard = new Keyboard({
                onKeyPress: button => handleKeyClick(button),
                layout: {
                    'default': [
                        '` 1 2 3 4 5 6 7 8 9 0 - = {bksp}',
                        '{tab} q w e r t y u i o p [ ]',
                        'a s d f g h j k l ; \' {enter}',
                        '{shift} z x c v b n m , . / {shift}',
                        '{ctrl} {alt} {meta} {space} {meta} {alt} {arrowleft} {arrowup} {arrowdown} {arrowright}'
                    ]
                },
                display: {
                    '{bksp}': '削除',
                    '{enter}': 'Return',
                    '{shift}': '⇧',
                    '{tab}': 'Tab',
                    '{space}': 'Space',
                    '{ctrl}': '⌃',
                    '{alt}': '⌥',
                    '{meta}': '⌘',
                    '{arrowup}': '↑',
                    '{arrowdown}': '↓',
                    '{arrowleft}': '←',
                    '{arrowright}': '→'
                },
                buttonTheme: [
                    {
                        class: "hg-blue",
                        buttons: "{meta} {alt} {ctrl} {shift}"
                    }
                ]
            });
            
            return keyboard;
        };

        /**
         * すべてのショートカットを一覧表で表示する
         */
        const renderAllShortcutsTable = () => {
            const tableContainer = document.getElementById('all-shortcuts-table');
            
            // カテゴリーごとにショートカットをグループ化
            const categories = {};
            shortcutData.forEach(shortcut => {
                const cat = shortcut.category || 'その他';
                if (!categories[cat]) {
                    categories[cat] = [];
                }
                categories[cat].push(shortcut);
            });

            // カテゴリーごとにテーブルを生成
            let html = '';
            Object.keys(categories).sort().forEach(category => {
                html += `
                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-gray-800 mb-3 bg-blue-50 px-4 py-2 rounded-lg border-l-4 border-blue-500">
                            ${category}
                        </h3>
                        <table class="min-w-full bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">
                                        ショートカットキー
                                    </th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">
                                        コマンド
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                `;
                
                // カテゴリー内でコマンド名でソート
                categories[category].sort((a, b) => a.command.localeCompare(b.command, 'ja'));
                
                categories[category].forEach((shortcut, index) => {
                    const rowClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    html += `
                        <tr class="${rowClass} hover:bg-blue-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono">
                                ${formatKeys(shortcut.keys)}
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">
                                ${shortcut.command}
                            </td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            });
            
            tableContainer.innerHTML = html;
        };

        window.onload = () => {
            initKeyboard();
            renderAllShortcutsTable();
            // 初期表示としてVキーを選択（選択ツール）
            handleKeyClick('V'); 
        };
    </script>
</body>
</html>
